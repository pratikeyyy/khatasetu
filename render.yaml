# KhataSetu — Render Blueprint (free tier, lifetime-free plan)
# Deploy: Render dashboard -> New -> Blueprint -> connect pratikeyyy/khatasetu repo.
# LIFETIME NOTE (user requirement, 2026-11-16): Render's free web service never
# expires (750 hrs/mo, sleeps after 15 min idle), BUT Render's free Postgres
# EXPIRES — deleted ~30 days after creation (+14-day grace) per Render's own
# terms, so it is NOT used here. The database is Neon Free Postgres instead:
# no time limit, no card, 100 CU-hours/mo, 1 GB storage, scales to zero when idle.
# Create the Neon project first (neon.tech, sign in with GitHub), copy its
# connection string, and paste it as DATABASE_URL in the Render dashboard.
# Do NOT commit real secrets here; JWT_SECRET is generated by Render, and
# DATABASE_URL + GEMINI_API_KEY are entered manually in the dashboard (sync: false).

services:
  - type: web
    name: khatasetu
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        # GitHub Pages origin (origin only, no path). Frontend will live at
        # https://pratikeyyy.github.io/khatasetu/
        value: https://pratikeyyy.github.io
      - key: PYTHONUNBUFFERED
        value: "1"
