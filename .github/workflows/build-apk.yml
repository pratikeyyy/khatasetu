# Build KhataSetu Android APK (free GitHub Actions) and publish it as a
# public GitHub Release asset so anyone can download the APK directly.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Build release APK
        run: flutter build apk --release
        working-directory: frontend

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: khatasetu-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release (tag v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: KhataSetu Android App v1.0.0
          body: |
            KhataSetu Android app (APK) — install it directly on any Android phone.
            Web app: https://pratikeyyy.github.io/khatasetu/
            Backend: https://khatasetu.onrender.com/
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
