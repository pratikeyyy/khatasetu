# KhataSetu Flutter web -> GitHub Pages
# --base-href /khatasetu/ is REQUIRED: project Pages serves the app under the
# /khatasetu/ subpath, and without it Flutter's asset URLs 404.
# API_URL must point at the live Render backend (update if the service URL changes).

name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Flutter web (release)
        working-directory: frontend
        run: >
          flutter build web --release
          --base-href /khatasetu/
          --dart-define=API_URL=https://khatasetu.onrender.com/api/v1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
